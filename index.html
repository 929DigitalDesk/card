<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card-generator {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .card-generator h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card-generator">
    <h2>Card Generator</h2>
    <form id="cardForm">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter Name" required>
      </div>

      <!-- Course Field (Updated) -->
      <div class="form-group">
        <label for="courseSelect">Course</label>
        <select id="courseSelect" name="course" required>
          <option value="" disabled selected>Select Course</option>
          <option value="SUBJECT">SUBJECT</option>
          <option value="REGULAR">REGULAR</option>
          <option value="PRIVATE">PRIVATE</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit">Generate Card</button>

    </form>
  </div>

</body>
</html>
